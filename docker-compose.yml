services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: ethan-dao-wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-ethandao_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-ethandao_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-this-in-dokploy}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-admin123}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-ethandao.realtor@gmail.com}
      WORDPRESS_SITE_TITLE: ${WORDPRESS_SITE_TITLE:-Ethan Dao Realtor}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('WP_HOME') ?: 'https://ethan-dao.apps.neooi.com');
        define('WP_SITEURL', getenv('WP_SITEURL') ?: 'https://ethan-dao.apps.neooi.com');
        define('FS_METHOD', 'direct');
    command: >
      bash -lc '
        set -e;
        until wp db check --allow-root >/dev/null 2>&1; do sleep 2; done;
        if ! wp core is-installed --allow-root >/dev/null 2>&1; then
          echo "Installing WordPress for Ethan Dao...";
          wp core install
            --url="${WP_HOME:-https://ethan-dao.apps.neooi.com}"
            --title="${WORDPRESS_SITE_TITLE:-Ethan Dao Realtor}"
            --admin_user="${WORDPRESS_ADMIN_USER:-admin}"
            --admin_password="${WORDPRESS_ADMIN_PASSWORD:-admin123}"
            --admin_email="${WORDPRESS_ADMIN_EMAIL:-ethandao.realtor@gmail.com}"
            --skip-email
            --allow-root;
        fi;
        echo "Activating Ethan Dao theme...";
        wp theme activate ethan-dao-vanilla --allow-root >/dev/null 2>&1 || true;
        apache2-foreground
      '
    volumes:
      - wordpress_uploads:/var/www/html/wp-content/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-ethandao_wp}
      MARIADB_USER: ${WORDPRESS_DB_USER:-ethandao_wp}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-this-in-dokploy}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-root-password-in-dokploy}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mariadb_data:
  wordpress_uploads:
